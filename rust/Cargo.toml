[package]
name = "code-scry"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
